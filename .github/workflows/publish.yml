name: Publish Reel to Instagram
on:
  schedule:
    - cron: '0 17 * * *'   # 17:00 UTC = 8 PM Cairo (summer time) / 7 PM (winter)
  workflow_dispatch:
    inputs:
      date: { description: 'Date to post (YYYY-MM-DD). Empty = today in Cairo', required: false }
permissions: { contents: write }
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DATE: ${{ inputs.date }}
        run: python3 scripts/publish.py
      - name: Save posted marker
        run: |
          git config user.name "megoo-bot"; git config user.email "actions@users.noreply.github.com"
          git add reels/*/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Posted reel" && git push)
