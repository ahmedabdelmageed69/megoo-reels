name: Refresh Instagram token
on:
  schedule: [ { cron: '0 6 * * 1' } ]   # every Monday
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh and save token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_PAT secret is missing, so the Instagram token can't be renewed"; exit 1; fi
          NEW=$(python3 scripts/refresh_token.py)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
          echo "Token refreshed"
